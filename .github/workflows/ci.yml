name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types et build
        run: npm run build

      - name: Tests
        run: npm test

  backend:
    name: Backend Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` exige que le dossier de sortie du frontend
      # existe, même quand seul le Rust est vérifié.
      - name: Sortie frontend factice
        run: mkdir -p dist && touch dist/index.html

      - name: Formatage
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      # `cargo audit` signale les vulnérabilités connues des dépendances.
      # Une application qui détient un accès permanent à une boîte mail ne peut
      # pas se permettre de découvrir ces avis à la lecture des notes de version.
      # `working-directory` est ici un *input* de l'action, pas la clé de même nom
      # des étapes `run:` — celle-ci ne s'applique qu'aux commandes shell. Sans
      # cet input, l'action cherche un Cargo.lock à la racine du dépôt, où il n'y
      # en a pas : le manifeste Rust vit dans src-tauri.
      - name: Audit des dépendances
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
