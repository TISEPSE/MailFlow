name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types et build
        run: npm run build

      - name: Tests
        run: npm test

  backend:
    name: Backend Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dependances systeme Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` exige que le dossier de sortie du frontend
      # existe, meme quand seul le Rust est verifie.
      - name: Sortie frontend factice
        run: mkdir -p dist && touch dist/index.html

      - name: Formatage
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri

      # `cargo audit` signale les vulnerabilites connues des dependances.
      # Une application qui detient un acces permanent a une boite mail ne peut
      # pas se permettre de decouvrir ces avis a la lecture des notes de version.
      - name: Audit des dependances
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
