[package]
name = "mailflow"
version = "0.1.0"
description = "Client email de bureau qui automatise le tri de la boite Gmail"
authors = ["MailFlow"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.88"

[lib]
name = "mailflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
chrono = "0.4.45"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.13.4", features = ["json", "gzip", "brotli", "form"] }
oauth2 = { version = "5.0.0", default-features = false }
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread"] }
